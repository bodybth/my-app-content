<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Mol5sat</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-alt: #eef2f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.1);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.1);
      --warning-bg: #fef3c7;
      --warning-text: #92400e;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      --radius: 16px;
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-alt: #273549;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.16);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.14);
      --warning-bg: #451a03;
      --warning-text: #fde68a;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .topbar-titles {
      min-width: 0;
      flex: 1;
    }

    .topbar-title {
      font-size: 1.08rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .create-btn {
      height: 40px;
      padding: 0 13px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.86rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .create-btn:active {
      transform: scale(0.95);
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 1.08rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.93);
    }

    .icon-btn.spinning {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .offline-banner {
      display: none;
      background: var(--warning-bg);
      color: var(--warning-text);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .offline-banner.visible {
      display: block;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .search-input {
      width: 100%;
      padding: 12px 38px 12px 42px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      box-shadow: var(--shadow);
      user-select: text;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: var(--surface-alt);
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .search-clear.visible {
      display: flex;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 520px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.15s ease;
    }

    .card:active {
      transform: scale(0.98);
      border-color: var(--primary);
    }

    .card-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 1.55rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-body {
      min-width: 0;
      flex: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 3px;
      color: var(--text);
    }

    .card-desc {
      font-size: 0.83rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .card-arrow {
      color: var(--text-muted);
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .state-box {
      text-align: center;
      padding: 48px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .state-emoji {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .state-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .state-text {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 0.92rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin 0.75s linear infinite;
    }

    /* Modal Styles */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    @media (min-width: 520px) {
      .modal-backdrop {
        align-items: center;
      }
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
      user-select: text;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--surface-alt);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .tab-btn {
      padding: 9px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow);
    }

    .field {
      margin-bottom: 12px;
    }

    .field-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--primary);
    }

    .textarea {
      min-height: 90px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
    }

    .helper-text {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .error-msg {
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .token-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface-alt);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 0.8rem;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.8rem;
      font-family: inherit;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 500;
      z-index: 100;
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      pointer-events: none;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    [data-theme="dark"] .toast {
      background: #f1f5f9;
      color: #0f172a;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="offlineBanner" class="offline-banner">
    Offline mode — showing cached content
  </div>

  <header class="topbar">
    <div class="topbar-titles">
      <div id="headerTitle" class="topbar-title" dir="auto">Mol5sat</div>
      <div id="headerSubtitle" class="topbar-subtitle" dir="auto">Select a category to browse</div>
    </div>
    <div class="topbar-actions">
      <button id="createBtn" class="create-btn" aria-label="Create">+ Create</button>
      <button id="refreshBtn" class="icon-btn" aria-label="Refresh" title="Refresh">↻</button>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle Theme" title="Toggle Theme">🌙</button>
    </div>
  </header>

  <main class="container">
    <div id="searchWrap" class="search-wrap hidden">
      <span class="search-icon">🔍</span>
      <input id="searchInput" class="search-input" type="search" placeholder="Search categories or items..." autocomplete="off" />
      <button id="searchClear" class="search-clear" aria-label="Clear search">✕</button>
    </div>

    <div id="appContent"></div>
  </main>

  <!-- Create Modal (Password + GitHub Upload) -->
  <div id="createModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <div id="modalTitle" class="modal-title">Admin Access</div>
        <button id="closeModalBtn" class="icon-btn" style="width:34px;height:34px;font-size:0.95rem;" aria-label="Close">✕</button>
      </div>

      <div id="modalError" class="error-msg hidden"></div>

      <!-- Step 1: Password Gate -->
      <div id="authStep">
        <div class="field">
          <label class="field-label" for="passwordInput">Admin Password</label>
          <input id="passwordInput" class="input" type="password" placeholder="Enter password" autocomplete="off" />
        </div>
        <button id="unlockBtn" class="btn-primary">Unlock</button>
      </div>

      <!-- Step 2: Create Panel -->
      <div id="createStep" class="hidden">
        <!-- GitHub Token Setup (Saved once per device) -->
        <div id="tokenSavedRow" class="token-row hidden">
          <span>🔑 GitHub Token: <strong>Saved on this device</strong></span>
          <button id="changeTokenBtn" class="link-btn" type="button">Change</button>
        </div>
        <div id="tokenInputWrap" class="field">
          <label class="field-label" for="ghTokenInput">GitHub Fine-Grained Token (Repo Contents Write)</label>
          <input id="ghTokenInput" class="input" type="password" placeholder="github_pat_..." autocomplete="off" />
          <div class="helper-text">Saved locally on this device only. Required once to commit directly to GitHub.</div>
        </div>

        <div class="tabs">
          <button id="tabFileBtn" class="tab-btn active" type="button">Upload File</button>
          <button id="tabCatBtn" class="tab-btn" type="button">New Category</button>
        </div>

        <!-- Tab 1: Upload HTML File -->
        <div id="fileForm">
          <div class="field">
            <label class="field-label" for="fileCatSelect">Category</label>
            <select id="fileCatSelect" class="select"></select>
          </div>

          <div class="field">
            <label class="field-label" for="fileNameInput">Display Name (e.g. ai &amp; ml)</label>
            <input id="fileNameInput" class="input" type="text" placeholder="Enter title as it should appear" />
          </div>

          <div class="field">
            <label class="field-label" for="htmlFileInput">Choose HTML File</label>
            <input id="htmlFileInput" class="input" type="file" accept=".html,.htm,text/html" />
            <div class="helper-text">Or paste HTML code directly below if you do not want to pick a file.</div>
          </div>

          <div class="field">
            <label class="field-label" for="htmlPasteInput">HTML Code (Optional Fallback)</label>
            <textarea id="htmlPasteInput" class="textarea" placeholder="<!DOCTYPE html>..."></textarea>
          </div>

          <button id="submitFileBtn" class="btn-primary" type="button">Upload File to GitHub</button>
        </div>

        <!-- Tab 2: Add Category -->
        <div id="catForm" class="hidden">
          <div class="field">
            <label class="field-label" for="catNameInput">Category Name (e.g. AI &amp; ML)</label>
            <input id="catNameInput" class="input" type="text" placeholder="Enter category name" />
          </div>

          <div class="field">
            <label class="field-label" for="catDescInput">Description (Optional)</label>
            <input id="catDescInput" class="input" type="text" placeholder="Short description" />
          </div>

          <div class="field">
            <label class="field-label" for="catIconInput">Icon / Emoji (Optional)</label>
            <input id="catIconInput" class="input" type="text" value="📘" maxlength="4" />
          </div>

          <button id="submitCatBtn" class="btn-primary" type="button">Create Category</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const CONFIG = {
      GITHUB_OWNER: "bodybth",
      GITHUB_REPO: "my-app-content",
      GITHUB_BRANCH: "main",
      BASE_URL: "https://bodybth.github.io/my-app-content/",
      DATA_URL: "https://bodybth.github.io/my-app-content/data.json",
      ADMIN_PASSWORD: "ae2007",
      DEFAULT_TITLE: "Mol5sat",
      DEFAULT_SUBTITLE: "Select a category to browse"
    };

    const STORAGE_KEYS = {
      DATA: "app_cached_data_v1",
      THEME: "app_theme_preference_v1",
      GH_TOKEN: "app_github_pat_v1"
    };

    const state = {
      data: null,
      loading: true,
      error: null,
      selectedCategoryId: null,
      searchQuery: "",
      unlocked: false,
      activeTab: "file",
      isBusy: false
    };

    const el = {
      offlineBanner: document.getElementById("offlineBanner"),
      headerTitle: document.getElementById("headerTitle"),
      headerSubtitle: document.getElementById("headerSubtitle"),
      createBtn: document.getElementById("createBtn"),
      refreshBtn: document.getElementById("refreshBtn"),
      themeBtn: document.getElementById("themeBtn"),
      searchWrap: document.getElementById("searchWrap"),
      searchInput: document.getElementById("searchInput"),
      searchClear: document.getElementById("searchClear"),
      appContent: document.getElementById("appContent"),
      createModal: document.getElementById("createModal"),
      modalTitle: document.getElementById("modalTitle"),
      closeModalBtn: document.getElementById("closeModalBtn"),
      modalError: document.getElementById("modalError"),
      authStep: document.getElementById("authStep"),
      passwordInput: document.getElementById("passwordInput"),
      unlockBtn: document.getElementById("unlockBtn"),
      createStep: document.getElementById("createStep"),
      tokenSavedRow: document.getElementById("tokenSavedRow"),
      changeTokenBtn: document.getElementById("changeTokenBtn"),
      tokenInputWrap: document.getElementById("tokenInputWrap"),
      ghTokenInput: document.getElementById("ghTokenInput"),
      tabFileBtn: document.getElementById("tabFileBtn"),
      tabCatBtn: document.getElementById("tabCatBtn"),
      fileForm: document.getElementById("fileForm"),
      catForm: document.getElementById("catForm"),
      fileCatSelect: document.getElementById("fileCatSelect"),
      fileNameInput: document.getElementById("fileNameInput"),
      htmlFileInput: document.getElementById("htmlFileInput"),
      htmlPasteInput: document.getElementById("htmlPasteInput"),
      submitFileBtn: document.getElementById("submitFileBtn"),
      catNameInput: document.getElementById("catNameInput"),
      catDescInput: document.getElementById("catDescInput"),
      catIconInput: document.getElementById("catIconInput"),
      submitCatBtn: document.getElementById("submitCatBtn"),
      toast: document.getElementById("toast")
    };

    let toastTimer = null;
    let isFetching = false;

    function safeStorageGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    function safeStorageSet(key, val) {
      try { localStorage.setItem(key, val); } catch (e) {}
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function base64ToUtf8(b64) {
      const binary = atob(b64.replace(/\s/g, ""));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function normalizeDisplayName(raw) {
      let name = (raw || "").trim();
      if (name.toLowerCase().endsWith(".html")) {
        name = name.slice(0, -5).trim();
      }
      return name;
    }

    function extractAsciiSlug(name) {
      let clean = (name || "").trim().toLowerCase();
      if (clean.endsWith(".html")) clean = clean.slice(0, -5);
      return clean.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }

    function inferCategoryFolder(cat) {
      if (cat && cat.folder) return cat.folder;
      const items = (cat && cat.items) || [];
      for (let i = 0; i < items.length; i++) {
        const parts = (items[i].url || "").replace(/^\/+/, "").split("/");
        if (parts.length >= 3 && parts[0] === "pages") return parts[1];
      }
      return extractAsciiSlug((cat && (cat.id || cat.title)) || "general") || "general";
    }

    function resolvePageUrl(rawUrl, bustCache) {
      if (!rawUrl) return "";
      let full = "";
      if (/^https?:\/\//i.test(rawUrl)) {
        full = rawUrl;
      } else {
        const base = CONFIG.BASE_URL.endsWith("/") ? CONFIG.BASE_URL : CONFIG.BASE_URL + "/";
        const clean = rawUrl.startsWith("/") ? rawUrl.slice(1) : rawUrl;
        full = base + clean;
      }
      if (bustCache) {
        const sep = full.includes("?") ? "&" : "?";
        full += sep + "v=" + Date.now();
      }
      return full;
    }

    function showToast(msg, duration) {
      el.toast.textContent = msg;
      el.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        el.toast.classList.remove("show");
      }, duration || 2600);
    }

    function updateNetworkStatus() {
      if (!navigator.onLine) {
        el.offlineBanner.classList.add("visible");
      } else {
        el.offlineBanner.classList.remove("visible");
      }
    }

    function initTheme() {
      const saved = safeStorageGet(STORAGE_KEYS.THEME);
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(saved || (prefersDark ? "dark" : "light"));
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      el.themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";
      safeStorageSet(STORAGE_KEYS.THEME, theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      applyTheme(current === "dark" ? "light" : "dark");
    }

    function supportsQueryNavigation() {
      const p = window.location.protocol;
      return p === "http:" || p === "https:" || p === "file:";
    }

    function getBaseLocalUrl() {
      return window.location.href.split("?")[0].split("#")[0];
    }

    function readCategoryFromUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        const qCat = params.get("cat");
        if (qCat) return qCat;
      } catch (e) {}

      const h = window.location.hash || "";
      if (h.indexOf("#cat=") === 0) {
        try { return decodeURIComponent(h.slice(5)); } catch (e) { return h.slice(5); }
      }
      return null;
    }

    function openCategory(categoryId) {
      if (supportsQueryNavigation()) {
        window.location.href = getBaseLocalUrl() + "?cat=" + encodeURIComponent(categoryId);
      } else {
        window.location.hash = "cat=" + encodeURIComponent(categoryId);
        state.selectedCategoryId = categoryId;
        clearSearch();
        render();
      }
    }

    function openItemPage(item) {
      if (!item || !item.url) {
        showToast("Page URL is missing", 2400);
        return;
      }
      if (!navigator.onLine) {
        showToast("You are currently offline", 2600);
        return;
      }
      showToast("Opening page...", 1500);
      window.location.href = resolvePageUrl(item.url, true);
    }

    function loadCachedData() {
      try {
        const raw = safeStorageGet(STORAGE_KEYS.DATA);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.categories)) {
          return parsed;
        }
      } catch (e) {}
      return null;
    }

    async function fetchRemoteData(isManual) {
      if (isFetching) return;
      isFetching = true;
      el.refreshBtn.classList.add("spinning");

      if (!state.data) {
        state.loading = true;
        state.error = null;
        render();
      }

      const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
      const timeoutId = controller ? setTimeout(function () { controller.abort(); }, 7000) : null;

      try {
        const sep = CONFIG.DATA_URL.includes("?") ? "&" : "?";
        const url = CONFIG.DATA_URL + sep + "t=" + Date.now() + "&r=" + Math.random().toString(36).slice(2);
        const options = controller ? { signal: controller.signal } : {};
        const response = await fetch(url, options);

        if (timeoutId) clearTimeout(timeoutId);

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const freshData = await response.json();
        if (!freshData || !Array.isArray(freshData.categories)) {
          throw new Error("Invalid data format");
        }

        const prevSerialized = state.data ? JSON.stringify(state.data) : "";
        const nextSerialized = JSON.stringify(freshData);
        const hasChanged = prevSerialized !== nextSerialized;

        safeStorageSet(STORAGE_KEYS.DATA, nextSerialized);
        state.data = freshData;
        state.loading = false;
        state.error = null;

        if (isManual) {
          if (hasChanged) {
            showToast("Content updated", 2400);
          } else {
            showToast("Already up to date (GitHub deploys in ~1 min)", 3000);
          }
        } else if (prevSerialized && hasChanged) {
          showToast("Content updated automatically", 2400);
        }

        render();
      } catch (err) {
        if (timeoutId) clearTimeout(timeoutId);
        state.loading = false;
        if (!state.data) {
          state.error = navigator.onLine
            ? "Failed to load content from server. Please check your connection."
            : "No internet connection and no cached data available.";
        } else if (isManual) {
          showToast("Could not refresh — showing cached data", 2600);
        }
        render();
      } finally {
        isFetching = false;
        el.refreshBtn.classList.remove("spinning");
      }
    }

    function clearSearch() {
      state.searchQuery = "";
      el.searchInput.value = "";
      el.searchClear.classList.remove("visible");
    }

    function getCategoryById(id) {
      if (!state.data || !Array.isArray(state.data.categories)) return null;
      return state.data.categories.find(function (c) { return c.id === id; }) || null;
    }

    function render() {
      if (state.loading && !state.data) {
        el.searchWrap.classList.add("hidden");
        el.headerTitle.textContent = CONFIG.DEFAULT_TITLE;
        el.headerSubtitle.textContent = "Loading...";
        el.appContent.innerHTML =
          '<div class="state-box">' +
            '<div class="spinner"></div>' +
            '<div class="state-title">Loading categories...</div>' +
            '<div class="state-text">Fetching the latest content</div>' +
          '</div>';
        return;
      }

      if (state.error && !state.data) {
        el.searchWrap.classList.add("hidden");
        el.headerTitle.textContent = CONFIG.DEFAULT_TITLE;
        el.headerSubtitle.textContent = "Connection error";
        el.appContent.innerHTML =
          '<div class="state-box">' +
            '<div class="state-emoji">📡</div>' +
            '<div class="state-title">Unable to Load Content</div>' +
            '<div class="state-text">' + escapeHtml(state.error) + '</div>' +
            '<button class="btn-primary" style="width:auto;" onclick="fetchRemoteData(true)">Retry</button>' +
          '</div>';
        return;
      }

      if (state.selectedCategoryId) {
        const cat = getCategoryById(state.selectedCategoryId);
        if (cat) {
          renderItemsView(cat);
          return;
        }
      }

      renderCategoriesView();
    }

    function renderCategoriesView() {
      el.searchWrap.classList.remove("hidden");
      el.searchInput.placeholder = "Search categories or items...";
      el.headerTitle.textContent = CONFIG.DEFAULT_TITLE;
      el.headerSubtitle.textContent = CONFIG.DEFAULT_SUBTITLE;

      const q = state.searchQuery.trim().toLowerCase();
      const categories = state.data.categories || [];

      const filtered = q
        ? categories.filter(function (cat) {
            const inCat =
              (cat.title && cat.title.toLowerCase().includes(q)) ||
              (cat.description && cat.description.toLowerCase().includes(q));
            const inItems = (cat.items || []).some(function (it) {
              return (
                (it.title && it.title.toLowerCase().includes(q)) ||
                (it.subtitle && it.subtitle.toLowerCase().includes(q)) ||
                (it.tag && it.tag.toLowerCase().includes(q))
              );
            });
            return inCat || inItems;
          })
        : categories;

      if (filtered.length === 0) {
        el.appContent.innerHTML =
          '<div class="state-box">' +
            '<div class="state-emoji">🗂️</div>' +
            '<div class="state-title">No Matching Results</div>' +
            '<div class="state-text">' + (q ? "Try a different search keyword" : "No categories added yet. Tap + Create to add one.") + '</div>' +
          '</div>';
        return;
      }

      const cardsHtml = filtered
        .map(function (cat) {
          const count = Array.isArray(cat.items) ? cat.items.length : 0;
          const descHtml = cat.description
            ? '<div class="card-desc" dir="auto">' + escapeHtml(cat.description) + '</div>'
            : "";
          return (
            '<article class="card" data-cat-id="' + escapeHtml(cat.id) + '">' +
              '<div class="card-icon">' + escapeHtml(cat.icon || "📁") + '</div>' +
              '<div class="card-body">' +
                '<div class="card-title" dir="auto">' + escapeHtml(cat.title || "Untitled Category") + '</div>' +
                descHtml +
                '<div class="card-meta">' +
                  '<span class="badge">' + count + " " + (count === 1 ? "item" : "items") + '</span>' +
                '</div>' +
              '</div>' +
              '<div class="card-arrow">›</div>' +
            '</article>'
          );
        })
        .join("");

      el.appContent.innerHTML = '<div class="cards-grid">' + cardsHtml + '</div>';

      el.appContent.querySelectorAll(".card[data-cat-id]").forEach(function (card) {
        card.addEventListener("click", function () {
          openCategory(card.getAttribute("data-cat-id"));
        });
      });
    }

    function renderItemsView(cat) {
      el.searchWrap.classList.remove("hidden");
      el.searchInput.placeholder = "Search inside this category...";
      el.headerTitle.textContent = cat.title || "Items";
      el.headerSubtitle.textContent = cat.description || "Select an item to open";

      const q = state.searchQuery.trim().toLowerCase();
      const items = cat.items || [];
      const filtered = q
        ? items.filter(function (it) {
            return (
              (it.title && it.title.toLowerCase().includes(q)) ||
              (it.subtitle && it.subtitle.toLowerCase().includes(q)) ||
              (it.tag && it.tag.toLowerCase().includes(q))
            );
          })
        : items;

      if (filtered.length === 0) {
        el.appContent.innerHTML =
          '<div class="state-box">' +
            '<div class="state-emoji">📄</div>' +
            '<div class="state-title">No Items Found</div>' +
            '<div class="state-text">' + (q ? "No items match your search" : "This category is empty. Tap + Create to upload a file.") + '</div>' +
          '</div>';
        return;
      }

      const itemsHtml = filtered
        .map(function (item) {
          const subHtml = item.subtitle
            ? '<div class="card-desc" dir="auto">' + escapeHtml(item.subtitle) + '</div>'
            : "";
          const tagHtml = item.tag
            ? '<div class="card-meta"><span class="badge">' + escapeHtml(item.tag) + '</span></div>'
            : "";
          return (
            '<article class="card" data-item-id="' + escapeHtml(item.id) + '">' +
              '<div class="card-icon">' + escapeHtml(item.icon || "📄") + '</div>' +
              '<div class="card-body">' +
                '<div class="card-title" dir="auto">' + escapeHtml(item.title || "Untitled Item") + '</div>' +
                subHtml +
                tagHtml +
              '</div>' +
              '<div class="card-arrow">›</div>' +
            '</article>'
          );
        })
        .join("");

      el.appContent.innerHTML = '<div class="items-list">' + itemsHtml + '</div>';

      el.appContent.querySelectorAll(".card[data-item-id]").forEach(function (card) {
        card.addEventListener("click", function () {
          const id = card.getAttribute("data-item-id");
          const found = items.find(function (i) { return i.id === id; });
          openItemPage(found);
        });
      });
    }

    /* ==========================================
       GitHub API Helpers (Create Category / Upload File)
    ========================================== */
    function ghApiUrl(path) {
      return (
        "https://api.github.com/repos/" +
        CONFIG.GITHUB_OWNER + "/" +
        CONFIG.GITHUB_REPO + "/contents/" +
        path
      );
    }

    async function ghGetFile(path, token) {
      const res = await fetch(ghApiUrl(path) + "?ref=" + encodeURIComponent(CONFIG.GITHUB_BRANCH) + "&t=" + Date.now(), {
        headers: {
          "Authorization": "Bearer " + token,
          "Accept": "application/vnd.github+json"
        }
      });
      if (res.status === 404) return null;
      if (!res.ok) {
        const errData = await res.json().catch(function () { return {}; });
        throw new Error(errData.message || "GitHub API error (" + res.status + ")");
      }
      return await res.json();
    }

    async function ghPutFile(path, contentStr, commitMsg, token, existingSha) {
      const body = {
        message: commitMsg,
        content: utf8ToBase64(contentStr),
        branch: CONFIG.GITHUB_BRANCH
      };
      if (existingSha) {
        body.sha = existingSha;
      }

      const res = await fetch(ghApiUrl(path), {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + token,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const errData = await res.json().catch(function () { return {}; });
        throw new Error(errData.message || "GitHub upload failed (" + res.status + ")");
      }
      return await res.json();
    }

    /* ==========================================
       Create Modal Logic
    ========================================== */
    function showModalError(msg) {
      if (!msg) {
        el.modalError.classList.add("hidden");
        el.modalError.textContent = "";
      } else {
        el.modalError.textContent = msg;
        el.modalError.classList.remove("hidden");
      }
    }

    function syncTokenUI() {
      const savedToken = safeStorageGet(STORAGE_KEYS.GH_TOKEN);
      if (savedToken) {
        el.tokenSavedRow.classList.remove("hidden");
        el.tokenInputWrap.classList.add("hidden");
      } else {
        el.tokenSavedRow.classList.add("hidden");
        el.tokenInputWrap.classList.remove("hidden");
      }
    }

    function populateCategorySelect() {
      const categories = (state.data && state.data.categories) || [];
      el.fileCatSelect.innerHTML = "";
      if (categories.length === 0) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "No categories yet — create one first";
        el.fileCatSelect.appendChild(opt);
        return;
      }
      categories.forEach(function (cat) {
        const opt = document.createElement("option");
        opt.value = cat.id;
        opt.textContent = cat.title || cat.id;
        if (state.selectedCategoryId && cat.id === state.selectedCategoryId) {
          opt.selected = true;
        }
        el.fileCatSelect.appendChild(opt);
      });
    }

    function switchModalTab(tab) {
      state.activeTab = tab;
      showModalError("");
      if (tab === "file") {
        el.tabFileBtn.classList.add("active");
        el.tabCatBtn.classList.remove("active");
        el.fileForm.classList.remove("hidden");
        el.catForm.classList.add("hidden");
        populateCategorySelect();
      } else {
        el.tabCatBtn.classList.add("active");
        el.tabFileBtn.classList.remove("active");
        el.catForm.classList.remove("hidden");
        el.fileForm.classList.add("hidden");
      }
    }

    function openCreateModal() {
      showModalError("");
      el.createModal.classList.add("open");
      el.createModal.setAttribute("aria-hidden", "false");

      if (state.unlocked) {
        el.modalTitle.textContent = "Create Content";
        el.authStep.classList.add("hidden");
        el.createStep.classList.remove("hidden");
        syncTokenUI();
        populateCategorySelect();
      } else {
        el.modalTitle.textContent = "Admin Access";
        el.authStep.classList.remove("hidden");
        el.createStep.classList.add("hidden");
        el.passwordInput.value = "";
        setTimeout(function () { el.passwordInput.focus(); }, 60);
      }
    }

    function closeCreateModal() {
      if (state.isBusy) return;
      el.createModal.classList.remove("open");
      el.createModal.setAttribute("aria-hidden", "true");
      showModalError("");
    }

    function getActiveToken() {
      const typed = el.ghTokenInput.value.trim();
      if (typed) {
        safeStorageSet(STORAGE_KEYS.GH_TOKEN, typed);
        syncTokenUI();
        return typed;
      }
      return safeStorageGet(STORAGE_KEYS.GH_TOKEN) || "";
    }

    function setBusy(busy, btn, label) {
      state.isBusy = busy;
      el.submitFileBtn.disabled = busy;
      el.submitCatBtn.disabled = busy;
      if (btn && label) btn.textContent = label;
    }

    async function handleCreateCategory() {
      showModalError("");
      if (!navigator.onLine) {
        showModalError("You must be online to create a category.");
        return;
      }

      const token = getActiveToken();
      if (!token) {
        showModalError("Please enter your GitHub Fine-Grained Token first.");
        return;
      }

      const displayTitle = normalizeDisplayName(el.catNameInput.value);
      if (!displayTitle) {
        showModalError("Category name cannot be empty.");
        return;
      }

      const description = el.catDescInput.value.trim();
      const icon = el.catIconInput.value.trim() || "📘";

      setBusy(true, el.submitCatBtn, "Creating...");

      try {
        const remoteDataFile = await ghGetFile("data.json", token);
        let repoData = { appTitle: CONFIG.DEFAULT_TITLE, appSubtitle: CONFIG.DEFAULT_SUBTITLE, categories: [] };
        let dataSha = null;

        if (remoteDataFile && remoteDataFile.content) {
          dataSha = remoteDataFile.sha;
          repoData = JSON.parse(base64ToUtf8(remoteDataFile.content));
          if (!Array.isArray(repoData.categories)) repoData.categories = [];
        }

        const existingFolders = {};
        repoData.categories.forEach(function (c) {
          existingFolders[inferCategoryFolder(c)] = true;
        });

        const baseSlug = extractAsciiSlug(displayTitle) || ("cat-" + Date.now());
        let folderSlug = baseSlug;
        let counter = 2;
        while (existingFolders[folderSlug]) {
          folderSlug = baseSlug + "-" + counter;
          counter++;
        }

        await ghPutFile(
          "pages/" + folderSlug + "/.gitkeep",
          "",
          "Create folder for category '" + displayTitle + "'",
          token,
          null
        );

        repoData.categories.push({
          id: folderSlug,
          folder: folderSlug,
          title: displayTitle,
          description: description,
          icon: icon,
          items: []
        });

        await ghPutFile(
          "data.json",
          JSON.stringify(repoData, null, 2),
          "Add category '" + displayTitle + "'",
          token,
          dataSha
        );

        state.data = repoData;
        safeStorageSet(STORAGE_KEYS.DATA, JSON.stringify(repoData));
        el.catNameInput.value = "";
        el.catDescInput.value = "";
        render();

        setBusy(false, el.submitCatBtn, "Create Category");
        closeCreateModal();
        showToast("Category created and synced to GitHub!", 3200);
      } catch (err) {
        setBusy(false, el.submitCatBtn, "Create Category");
        showModalError("Error: " + (err.message || "Failed to create category."));
      }
    }

    async function handleUploadFile() {
      showModalError("");
      if (!navigator.onLine) {
        showModalError("You must be online to upload a file.");
        return;
      }

      const token = getActiveToken();
      if (!token) {
        showModalError("Please enter your GitHub Fine-Grained Token first.");
        return;
      }

      const catId = el.fileCatSelect.value;
      if (!catId) {
        showModalError("Please select a category (or create one first).");
        return;
      }

      const displayTitle = normalizeDisplayName(el.fileNameInput.value);
      if (!displayTitle) {
        showModalError("Please enter a display name for the file.");
        return;
      }

      const pickedFile = el.htmlFileInput.files && el.htmlFileInput.files[0];
      const pastedHtml = el.htmlPasteInput.value;
      let htmlContent = "";

      if (pickedFile) {
        htmlContent = await pickedFile.text();
      } else if (pastedHtml && pastedHtml.trim()) {
        htmlContent = pastedHtml;
      } else {
        showModalError("Please select an HTML file or paste HTML code.");
        return;
      }

      setBusy(true, el.submitFileBtn, "Uploading...");

      try {
        const remoteDataFile = await ghGetFile("data.json", token);
        if (!remoteDataFile || !remoteDataFile.content) {
          throw new Error("data.json not found on GitHub");
        }

        const dataSha = remoteDataFile.sha;
        const repoData = JSON.parse(base64ToUtf8(remoteDataFile.content));
        const targetCat = (repoData.categories || []).find(function (c) { return c.id === catId; });
        if (!targetCat) {
          throw new Error("Selected category no longer exists");
        }
        if (!Array.isArray(targetCat.items)) targetCat.items = [];

        const catFolder = inferCategoryFolder(targetCat);
        const existingItem = targetCat.items.find(function (it) {
          return (it.title || "").trim().toLowerCase() === displayTitle.toLowerCase();
        });

        let relUrl = "";
        if (existingItem && existingItem.url) {
          relUrl = existingItem.url;
        } else {
          const existingUrls = {};
          targetCat.items.forEach(function (it) {
            if (it.url) existingUrls[it.url] = true;
          });
          const baseSlug = extractAsciiSlug(displayTitle) || ("page-" + Date.now());
          let filename = baseSlug + ".html";
          let counter = 2;
          while (existingUrls["pages/" + catFolder + "/" + filename]) {
            filename = baseSlug + "-" + counter + ".html";
            counter++;
          }
          relUrl = "pages/" + catFolder + "/" + filename;
        }

        const existingPage = await ghGetFile(relUrl, token);
        const pageSha = existingPage ? existingPage.sha : null;

        await ghPutFile(
          relUrl,
          htmlContent,
          (existingItem ? "Update file '" : "Add file '") + displayTitle + "' in '" + targetCat.title + "'",
          token,
          pageSha
        );

        if (existingItem) {
          existingItem.title = displayTitle;
        } else {
          targetCat.items.push({
            id: "item-" + Date.now(),
            title: displayTitle,
            subtitle: "",
            tag: "",
            icon: "📄",
            url: relUrl
          });
        }

        await ghPutFile(
          "data.json",
          JSON.stringify(repoData, null, 2),
          "Update data.json for '" + displayTitle + "'",
          token,
          dataSha
        );

        state.data = repoData;
        safeStorageSet(STORAGE_KEYS.DATA, JSON.stringify(repoData));
        el.fileNameInput.value = "";
        el.htmlFileInput.value = "";
        el.htmlPasteInput.value = "";
        render();

        setBusy(false, el.submitFileBtn, "Upload File to GitHub");
        closeCreateModal();
        showToast("Uploaded! Page will be live on GitHub Pages in ~1 min.", 3800);
      } catch (err) {
        setBusy(false, el.submitFileBtn, "Upload File to GitHub");
        showModalError("Error: " + (err.message || "Failed to upload file."));
      }
    }

    /* ==========================================
       Event Bindings & Init
    ========================================== */

    el.refreshBtn.addEventListener("click", function () { fetchRemoteData(true); });
    el.createBtn.addEventListener("click", openCreateModal);
    el.closeModalBtn.addEventListener("click", closeCreateModal);
    el.createModal.addEventListener("click", function (e) {
      if (e.target === el.createModal) closeCreateModal();
    });

    el.unlockBtn.addEventListener("click", function () {
      if (el.passwordInput.value === CONFIG.ADMIN_PASSWORD) {
        state.unlocked = true;
        showModalError("");
        el.modalTitle.textContent = "Create Content";
        el.authStep.classList.add("hidden");
        el.createStep.classList.remove("hidden");
        syncTokenUI();
        populateCategorySelect();
      } else {
        showModalError("Incorrect password.");
      }
    });

    el.passwordInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") el.unlockBtn.click();
    });

    el.changeTokenBtn.addEventListener("click", function () {
      el.ghTokenInput.value = "";
      el.tokenSavedRow.classList.add("hidden");
      el.tokenInputWrap.classList.remove("hidden");
      el.ghTokenInput.focus();
    });

    el.tabFileBtn.addEventListener("click", function () { switchModalTab("file"); });
    el.tabCatBtn.addEventListener("click", function () { switchModalTab("cat"); });
    el.submitCatBtn.addEventListener("click", handleCreateCategory);
    el.submitFileBtn.addEventListener("click", handleUploadFile);

    el.searchInput.addEventListener("input", function (e) {
      state.searchQuery = e.target.value;
      el.searchClear.classList.toggle("visible", state.searchQuery.length > 0);
      render();
    });

    el.searchClear.addEventListener("click", function () {
      clearSearch();
      el.searchInput.focus();
      render();
    });

    window.addEventListener("hashchange", function () {
      state.selectedCategoryId = readCategoryFromUrl();
      clearSearch();
      render();
    });

    window.addEventListener("pageshow", function () {
      state.selectedCategoryId = readCategoryFromUrl();
      render();
      if (navigator.onLine) {
        fetchRemoteData(false);
      }
    });

    window.addEventListener("online", function () {
      updateNetworkStatus();
      fetchRemoteData(false);
    });
    window.addEventListener("offline", updateNetworkStatus);

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && navigator.onLine) {
        fetchRemoteData(false);
      }
    });

    initTheme();
    updateNetworkStatus();
    state.selectedCategoryId = readCategoryFromUrl();

    const cached = loadCachedData();
    if (cached) {
      state.data = cached;
      state.loading = false;
      render();
    }
    fetchRemoteData(false);
  </script>
</body>
</html>
